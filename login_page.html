<!DOCTYPE html>
<html>
    <head>
        <title>Simple Login Form</title>

        <style>
            body{
                margin:0;
                padding:0;
                font-family:sans-serif;
                background:pink;
                display:flex;
                justify-content:center;
                align-items:center;
                height: 100vh;
            }

            .login-box{
                padding: 40px;
                background: royalblue;
                box-shadow: 0 15px 25px rgba(0,0,0,.5);
                border-radius: 10px;
                width: 400px;
            }

            .login-box h2{
                margin-bottom: 30px;
                color: maroon;
                text-align: center;
            }

            .user_data{
                width: 100%;
                padding: 12px 10px;
                margin: 10px 0;
                border: 3px solid black;
                border-radius:5px;
                box-sizing: border-box;
            }

            .btn{
                width: 100%;
                background: maroon;
                padding: 10px;
                border: none;
                border-radius: 5px;
                color: white;
                font-size: 18px;
                cursor:pointer;
            }

            .btn:hover{
                background: purple;
            }

        </style>

    </head>

    <body>
        <div class="login-box">
            <h2>Login Page</h2>

            <form>
                <input type="text" class="user_data"
                placeholder="Username"required/>

                <input type="password" class="user_data"
                placeholder="Password"required/>

                <button class="btn">login</button>
            </form>

        </div>
    </body>
    
</html>
